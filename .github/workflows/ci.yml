name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: yamat47/github-toolkit/actions/checkout@v1.8.0
        with:
          persist-credentials: false

      - uses: yamat47/github-toolkit/actions/setup-node-with-pnpm@v1.8.0
        with:
          node-version-file: .node-version

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
