services:
  app:
    build: .
    init: true
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      # Kept out of the bind mount: the packages include Linux binaries that
      # must not mix with ones installed on the host.
      - node_modules:/app/node_modules

volumes:
  node_modules:
