  <body>
    <main class="app">
      <h1 class="title">Word counter</h1>

      <label class="visually-hidden" for="text">Text to count</label>
      <textarea
        id="text"
        class="sheet"
        placeholder="Type or paste your text here"
        spellcheck="false"
        autofocus
      ></textarea>

      <dl class="counts">
        <div class="count count-primary">
          <dt>Words</dt>
          <dd data-count="words">0</dd>
        </div>
        <div class="count">
          <dt>Characters</dt>
          <dd data-count="characters">0</dd>
        </div>
        <div class="count">
          <dt>Characters (no spaces)</dt>
          <dd data-count="charactersWithoutSpaces">0</dd>
        </div>
      </dl>

      <footer class="notes">
        <noscript><p>Turn on JavaScript to see the counts.</p></noscript>
        <p>
          Count results are for reference only and may vary based on language and character
          handling.
        </p>
